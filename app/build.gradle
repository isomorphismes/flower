plugins { id "com.android.application" }
// An explicit build invocation chooses the ABI. A1 stays the default;
// C67 is AArch64 and never inherits an ARMv7-only JNI directory.
def flowerAbi = (project.findProperty("flowerAbi") ?: "armeabi-v7a").toString()
if (!(flowerAbi in ["armeabi-v7a", "arm64-v8a"])) {
    throw new GradleException("Unsupported Flower MIRO ABI: " + flowerAbi)
}
android {
    namespace "org.isomorphisms.flower"
    compileSdk 34
    defaultConfig {
        applicationId "org.isomorphisms.flower"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-topology-test"
        ndk { abiFilters flowerAbi }
    }
    signingConfigs {
        development {
            storeFile rootProject.file("android/dev-test.jks")
            storePassword "android"
            keyAlias "flower-test"
            keyPassword "android"
        }
    }
    buildTypes { debug { signingConfig signingConfigs.development } }
    packaging { jniLibs { useLegacyPackaging = true } }
}

name: Flower MIRO C67 native ARM64 subpixel APK candidate
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'app/build.gradle'
      - 'src/**'
      - 'tests/android_metric_touch.pi'
      - 'tests/android_metric_text.pi'
      - 'app/src/main/**'
      - '.github/workflows/c67-subpixel-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndk-arm64-c67-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout exact Flower candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout renamed 3x3/5x5 producer exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/rough.framebuffer
          ref: efff5fbe71d8722d713282c478dbdb52fa280f9b
          path: rough-subpixel
          persist-credentials: false
      - name: Check exact producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rough-subpixel rev-parse HEAD)" = efff5fbe71d8722d713282c478dbdb52fa280f9b
          test -s rough-subpixel/subpixel/include/subpixel/curve_patch.h
          test -s rough-subpixel/src/subpixel_framebuffer.c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install native Android SDK/NDK
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"'
      - name: Configure native Flower raylib 5.5 and Lua for C67 arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/android-c67 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.3.11579264/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
            -DFLOWER_SUBPIXEL_SOURCE="$GITHUB_WORKSPACE/rough-subpixel" \
            -DFLOWER_SUBPIXEL_EXPECTED_SHA=efff5fbe71d8722d713282c478dbdb52fa280f9b
      - name: Compile exact C67 NativeActivity with corrected 3x3 and 5x5
        run: cmake --build build/android-c67 --parallel 2
      - name: Verify real AArch64 shared library, overlay symbols and NativeActivity
        shell: bash
        run: |
          set -euo pipefail
          lib=app/src/main/jniLibs/arm64-v8a/libflower.so
          test -s "$lib"
          readelf="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          # Reading full output before grep avoids a false broken-pipe
          # failure (llvm-readelf can exit 74 when grep -q closes early).
          "$readelf" -h "$lib" > "$RUNNER_TEMP/flower-elf-header.txt"
          "$readelf" -sW "$lib" > "$RUNNER_TEMP/flower-elf-symbols.txt"
          grep -Eq 'Class:.*ELF64' "$RUNNER_TEMP/flower-elf-header.txt"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/flower-elf-header.txt"
          grep -Fq 'flower_diagram_update' "$RUNNER_TEMP/flower-elf-symbols.txt"
          grep -Fq 'flower_subpixel_round' "$RUNNER_TEMP/flower-elf-symbols.txt"
          grep -Fq 'rough_blend_subpixel_coverage' "$RUNNER_TEMP/flower-elf-symbols.txt"
          grep -Fq 'ANativeActivity_onCreate' "$RUNNER_TEMP/flower-elf-symbols.txt"
          sha256sum "$lib"
      - name: Package stable signer C67 test-only APK
        run: gradle --no-daemon -PflowerAbi=arm64-v8a :app:assembleDebug
      - name: Inspect package ABI and reject A1-only library in C67 artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$apk" | grep -Fxq 'lib/arm64-v8a/libflower.so'
          if unzip -Z1 "$apk" | grep -Fq 'lib/armeabi-v7a/'; then
            echo 'Incorrect A1 ABI also packaged into C67 arm64 candidate' >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/flower-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/flower-badging.txt"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$apk" |
            tee app/build/outputs/apk/debug/SIGNER.txt
          grep -Fq '0cdc0345351b88296870f277a7a7ae1709f7fbc41603a97a8ad71d5931215543' \
            app/build/outputs/apk/debug/SIGNER.txt
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          git rev-parse HEAD | tee app/build/outputs/apk/debug/SOURCE.txt
          git -C rough-subpixel rev-parse HEAD | tee app/build/outputs/apk/debug/PRODUCER.txt
      - name: Keep digest-bound C67 candidate, not a physical receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flower-miro-c67-arm64-subpixel-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SIGNER.txt
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/SOURCE.txt
            app/build/outputs/apk/debug/PRODUCER.txt
            app/src/main/jniLibs/arm64-v8a/libflower.so
          if-no-files-found: error
          retention-days: 14

  android-metric-touch:
    needs: ndk-arm64-c67-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flower-miro-c67-arm64-subpixel-candidate
          path: package
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon-interface
          persist-credentials: false
      - name: Verify packaged source and exact APK before install
        run: |
          apk=$(find package -type f -name app-debug.apk)
          test -f "$apk"
          records=$(dirname "$apk")
          test "$(cat "$records/SOURCE.txt")" = "$(git rev-parse HEAD)"
          expected=$(cut -d ' ' -f 1 "$records/SHA256SUMS.txt")
          printf '%s  %s\n' "$expected" "$apk" | sha256sum -c -
          cp "$apk" checked-flower.apk
      - name: Enable accelerated Android emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
      - name: Install the ARM64 APK and select two material nodes on Android
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: PATH=/usr/bin:$PATH ITHON_PYTHON=/usr/bin/python3 ithon-interface/ithon tests/android_metric_touch.pi
      - name: Read the bitmap font at the application’s pinned raylib revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: raysan5/raylib
          ref: c1ab645ca298a2801097931d1079b10ff7eb9df8
          path: raylib-font
          sparse-checkout: src/rtext.c
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compare every painted metric digit and reject well-formed wrong readouts
        env:
          ITHON_PYTHON: /usr/bin/python3
        run: |
          test "$(git -C raylib-font rev-parse HEAD)" = c1ab645ca298a2801097931d1079b10ff7eb9df8
          ithon-interface/ithon tests/android_metric_text.pi raylib-font/src/rtext.c metric-touch
      - name: Retain unmodified Android frames and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flower-android-metric-touch
          path: metric-touch/
          if-no-files-found: warn

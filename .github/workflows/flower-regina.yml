name: Regina checks the actual retained Flower Net
on:
  push:
    branches: [sun/flower-regina-01]
  pull_request:
permissions:
  contents: read
jobs:
  regina:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact adapter source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the actual retained Flower application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/flower
          ref: f404096058cf4b6ac35b59d6b67cb72587b297d8
          path: retained
          persist-credentials: false
      - name: Check out the independent Regina oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 6f20703ef8f065d3c99dd5398a09ee67c3b19a98
          path: oracle
          persist-credentials: false
      - name: Check out the checked Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
      - name: Acquire and qualify the declared ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Prepare host outputs
        run: mkdir -p build/regina-net
      - name: Acquire an isolated host runtime for the foreign Regina oracle
        run: python3 -m venv build/regina-runtime
      - name: Install exact foreign Regina version and record acquisition
        run: build/regina-runtime/bin/python -m pip install --disable-pip-version-check --report build/regina-net/regina-acquisition.json regina==7.4.1
      - name: Compile the host adapter against the actual retained implementation
        run: >-
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic -std=c17
          -O2 -Wall -Wextra -Werror -I retained/src
          examples/autogenerated/net-topology/export.c retained/src/flower.c
          retained/src/flower_mesh.c -lm -o build/regina-net/export-net
      - name: Export the actual normal drawing caches and check material adjacency controls
        run: build/regina-net/export-net normal build/regina-net/normal-1.obj build/regina-net/normal-2.obj
      - name: Export coincident folded geometry without welding material IDs
        run: build/regina-net/export-net folded build/regina-net/folded-1.obj build/regina-net/folded-2.obj
      - name: Compile the shared build-contract verifier through ICK
        run: >-
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic -std=c17
          -O2 -Wall -Wextra -Werror oracle/src/aici.c -o build/regina-net/aici
      - name: Check the explicit compile stages
        run: build/regina-net/aici verify ci/regina-build-toolchain.contract.tsv .
      - name: Execute Regina disk, annulus, torus, Mobius and seven rejection controls
        run: env ITHON_PYTHON=${{ github.workspace }}/build/regina-runtime/bin/python ithon/ithon oracle/geometry/flower-metric/topology.pi --self-test
      - name: Check normal density one with real Regina
        run: env ITHON_PYTHON=${{ github.workspace }}/build/regina-runtime/bin/python ithon/ithon oracle/geometry/flower-metric/topology.pi build/regina-net/normal-1.obj annulus
      - name: Check normal density two with real Regina
        run: env ITHON_PYTHON=${{ github.workspace }}/build/regina-runtime/bin/python ithon/ithon oracle/geometry/flower-metric/topology.pi build/regina-net/normal-2.obj annulus
      - name: Check folded density one with real Regina
        run: env ITHON_PYTHON=${{ github.workspace }}/build/regina-runtime/bin/python ithon/ithon oracle/geometry/flower-metric/topology.pi build/regina-net/folded-1.obj annulus
      - name: Check folded density two with real Regina
        run: env ITHON_PYTHON=${{ github.workspace }}/build/regina-runtime/bin/python ithon/ithon oracle/geometry/flower-metric/topology.pi build/regina-net/folded-2.obj annulus
      - name: Retain source-bound host topology evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flower-actual-net-regina
          path: build/regina-net
          if-no-files-found: error

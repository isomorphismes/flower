name: Finite annular mechanics with pinned ICK
on:
  push:
    branches: [sun/flower-realization-01]
  pull_request:
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Flower source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the independent energy and output oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 85955857fdecb85e069695f01a23edf3bac9e11e
          path: oracle
          persist-credentials: false
      - name: Check out the checked Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: ithon
          persist-credentials: false
      - name: Acquire and qualify the declared ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Prepare output directory
        run: mkdir -p build/annular-mechanics
      # These are direct executable invocations through Actions' fixed command
      # interface, not a second authored shell program or consumer compiler.
      - name: Compile finite mechanics and its native controls
        run: >-
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic
          -std=c17 -O2 -Wall -Wextra -Werror -fno-fast-math -ffp-contract=off
          crochet/stitch_ledger.c crochet/material_geometry.c
          crochet/annular_mechanics.c crochet/test_annular_mechanics.c -lm
          -o build/annular-mechanics/test-annular-mechanics
      - name: Execute energy, convergence and refusal controls
        run: >-
          build/annular-mechanics/test-annular-mechanics
          build/annular-mechanics/report.tsv build/annular-mechanics/mesh.obj
          build/annular-mechanics/mesh-fine.obj build/annular-mechanics/markers.tsv
      - name: Reconstruct energy, stationarity, both meshes and every material marker independently
        run: >-
          ithon/ithon oracle/examples/autogenerated/flower-mechanics/accept.pi
          build/annular-mechanics/report.tsv build/annular-mechanics/mesh.obj
          build/annular-mechanics/mesh-fine.obj build/annular-mechanics/markers.tsv
      - name: Compile the shared toolchain contract verifier through ICK
        run: >-
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic -std=c17
          -O2 -Wall -Wextra -Werror oracle/src/aici.c
          -o build/annular-mechanics/aici
      - name: Verify the declared build stages
        run: build/annular-mechanics/aici verify oracle/contracts/build-toolchain-v0.contract.tsv .
      - name: Source identity
        run: git rev-parse HEAD
      - name: Retain finite-model outputs and executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flower-annular-mechanics
          path: build/annular-mechanics
          if-no-files-found: error
